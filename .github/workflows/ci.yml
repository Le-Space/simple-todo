name: CI

# One workflow for every chapter. Which apps run is decided by what the change
# touched: an app's own folder, or anything shared, which means all of them.
# The nine chapter branches each carried their own copy of this and got it
# wrong in 32 places — a filter naming a branch that the file did not live on.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to run, space separated; empty means all'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: pick
        run: node .github/pick-apps.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APPS_INPUT: ${{ inputs.apps }}

  # Milliseconds, and it runs whatever the change touched: a spec importing a
  # helper the kit does not have fails at import time, but only in a spec that
  # some workflow actually runs — and several of them run nowhere.
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Every kit import resolves
        run: node packages/e2e-kit/src/check-kit-exports.mjs

  test:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      # The build stamps the chapter's last commit, so it asks git. This job
      # runs as root in the Playwright container while the checkout belongs to
      # the runner's user, and git refuses a repository it does not own —
      # checkout@v6 trusts it only inside its own step. Without this every
      # build here was stamp-less, and footer.spec.js says so.
      - name: Git may read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        working-directory: .
      # The version comes from packageManager in the root manifest; naming it
      # here as well makes the action refuse with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: No preview origin is written down by hand
        run: pnpm run check:preview-origin

      # qr01 was the only chapter that gated lint, types and its README on every
      # pull request, and it is the only one whose CI never let a type error
      # through. The gates stay per chapter rather than repo-wide until the
      # others have paid off the formatting debt they arrived with.
      - id: gates
        run: |
          node -e "
            const ci = require('./chapter.json').ci ?? {};
            for (const gate of ['lint', 'check', 'readme'])
              console.log(gate + '=' + (ci[gate] === true));
          " >> "$GITHUB_OUTPUT"
      - name: Lint
        if: steps.gates.outputs.lint == 'true'
        run: pnpm run lint
      - name: Types
        if: steps.gates.outputs.check == 'true'
        run: pnpm run check
      - name: The README's chapter block is current
        if: steps.gates.outputs.readme == 'true'
        run: node scripts/sync-chapter-readme.mjs --check
      - name: Unit tests
        run: pnpm run test:unit
      - name: Browser specs
        run: pnpm exec playwright test $(node -e "console.log(require('./chapter.json').ci.specs.join(' '))") --project=chromium

      # What the page looked like when it failed. Without this a flake on a
      # runner can only be guessed at from a locator name.
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results/
          retention-days: 7
