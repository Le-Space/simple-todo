name: Secrets check

# Reports the length of each secret this repository needs, never the value —
# GitHub masks values in logs, and a length is all anybody needs to see that a
# secret arrived. Written after a deploy spent ten minutes building before the
# publisher reported an empty ALEPH_PRIVATE_KEY.

permissions: {}

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lengths
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          RELAY_BUTTON_E2E_PRIVATE_KEY: ${{ secrets.RELAY_BUTTON_E2E_PRIVATE_KEY }}
          VITE_BUNDLER_AUTH_HEADER: ${{ secrets.VITE_BUNDLER_AUTH_HEADER }}
        run: |
          fail=0
          report() {
            printf '%-30s %3s characters  %s\n' "$1" "$2" "$3"
          }
          for name in ALEPH_PRIVATE_KEY RELAY_BUTTON_E2E_PRIVATE_KEY VITE_BUNDLER_AUTH_HEADER; do
            value="${!name}"
            n=${#value}
            case "$name" in
              *PRIVATE_KEY) want=64 ;;
              *) want=20 ;;
            esac
            if [ "$n" -ge "$want" ]; then report "$name" "$n" "ok"; else report "$name" "$n" "TOO SHORT — expected at least $want"; fail=1; fi
          done
          exit $fail
