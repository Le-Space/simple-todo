<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Theme init (before paint) — set light/dark from stored choice or system pref -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t !== 'light' && t !== 'dark') {
						t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.classList.toggle('dark', t === 'dark');
					document.documentElement.style.background = t === 'dark' ? '#0B0E15' : '#EDF1F8';
				} catch (e) {}
			})();
		</script>

		<!-- Favicon and Icons -->
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<link rel="icon" type="image/x-icon" href="./favicon.ico" />
		<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
		<link rel="manifest" href="./manifest.json" />
		<meta name="theme-color" content="#0B0E15" />

		<!-- SEO Meta Tags -->
		<!-- escrow01 is shown to people outside the tutorial -- a bank's
		     specialists among them -- so its title, description and social card
		     speak of what it demonstrates, in German, and say that it runs on a
		     testnet. The card is tools/aleph/make-og-cards.py's. -->
		<title>Vertrauliche Treuhand für delegierte Aufgaben · escrow01</title>
		<meta
			name="description"
			content="Demo: Alice delegiert eine Aufgabe an Bob und sperrt dafür ein Budget in einem vertraulichen Token. Der Betrag bleibt verschlüsselt (Zama FHE, ERC-7984), ein Passkey signiert, das Gas ist gesponsert. Im Sepolia-Testnetz."
		/>
		<meta name="author" content="Le Space UG" />
		<meta
			name="keywords"
			content="vertrauliche Treuhand, Zama, FHE, ERC-7984, Passkey, EIP-7702, Account Abstraction, local-first, peer-to-peer, OrbitDB"
		/>

		<!-- Open Graph / Facebook / LinkedIn / Telegram / Mail -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://escrow01.le-space.de/" />
		<meta property="og:title" content="Vertrauliche Treuhand für delegierte Aufgaben" />
		<meta
			property="og:description"
			content="Alice delegiert eine Aufgabe an Bob und sperrt ein Budget, dessen Betrag verschlüsselt bleibt (Zama FHE, ERC-7984). Ein Passkey signiert, das Gas ist gesponsert. Demo im Sepolia-Testnetz."
		/>
		<meta property="og:image" content="https://escrow01.le-space.de/og/escrow01.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta
			property="og:image:alt"
			content="Vertrauliche Treuhand: Budget gesperrt, Betrag verschlüsselt, Freigabe per Passkey. escrow01, Sepolia-Testnetz."
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="Le Space" />
		<meta property="og:locale" content="de_DE" />
		<meta property="og:locale:alternate" content="en_US" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://escrow01.le-space.de/" />
		<meta property="twitter:title" content="Vertrauliche Treuhand für delegierte Aufgaben" />
		<meta
			property="twitter:description"
			content="Alice delegiert eine Aufgabe an Bob und sperrt ein Budget, dessen Betrag verschlüsselt bleibt (Zama FHE, ERC-7984). Ein Passkey signiert, das Gas ist gesponsert. Demo im Sepolia-Testnetz."
		/>
		<meta property="twitter:image" content="https://escrow01.le-space.de/og/escrow01.jpg" />
		<meta
			property="twitter:image:alt"
			content="Vertrauliche Treuhand: Budget gesperrt, Betrag verschlüsselt, Freigabe per Passkey. escrow01, Sepolia-Testnetz."
		/>

		<!-- Additional Meta Tags -->
		<meta name="application-name" content="Simple-Todo" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Simple-Todo" />
		<meta name="msapplication-TileColor" content="#0B0E15" />
		<meta name="msapplication-config" content="./browserconfig.xml" />

		<!-- Still de-indexed, like every chapter, but canonical to itself: a link
		     preview that follows the canonical (LinkedIn does) would otherwise show
		     the main app instead of this demo. -->
		<link rel="canonical" href="https://escrow01.le-space.de/" />

		<!-- Technical Meta Tags -->
		<meta name="format-detection" content="telephone=no" />
		<meta name="robots" content="noindex, follow" />
		<meta name="googlebot" content="noindex, follow" />

		<!-- Schema.org markup -->
		<meta itemprop="name" content="Vertrauliche Treuhand für delegierte Aufgaben · escrow01" />
		<meta
			itemprop="description"
			content="Demo im Sepolia-Testnetz: ein Budget für eine delegierte Aufgabe, gesperrt in einem vertraulichen Token (Zama FHE, ERC-7984), freigegeben per Passkey."
		/>
		<meta itemprop="image" content="https://escrow01.le-space.de/og/escrow01.jpg" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
