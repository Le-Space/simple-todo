<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Theme init (before paint) — set light/dark from stored choice or system pref -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t !== 'light' && t !== 'dark') {
						t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.classList.toggle('dark', t === 'dark');
					document.documentElement.style.background = t === 'dark' ? '#0B0E15' : '#EDF1F8';
				} catch (e) {}
			})();
		</script>

		<!-- Favicon and Icons -->
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<link rel="icon" type="image/x-icon" href="./favicon.ico" />
		<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
		<link rel="manifest" href="./manifest/escrow01.json" />
		<meta name="theme-color" content="#0B0E15" />

		<!-- SEO Meta Tags -->
		<!-- escrow01 is shown to people outside the tutorial -- a bank's
		     specialists among them -- so its title, description and social card
		     speak of what it demonstrates, in German, and say that it runs on a
		     testnet. The card is tools/aleph/make-og-cards.py's. -->
		<title>Vertrauliche Treuhand für delegierte Aufgaben · escrow01</title>
		<meta
			name="description"
			content="Demo: Alice delegiert eine Aufgabe an Bob und sperrt dafür ein Budget in einem vertraulichen Token. Der Betrag bleibt verschlüsselt (Zama FHE, ERC-7984), ein Passkey signiert, das Gas ist gesponsert. Im Sepolia-Testnetz."
		/>
		<meta name="author" content="Le Space UG" />
		<meta
			name="keywords"
			content="vertrauliche Treuhand, Zama, FHE, ERC-7984, Passkey, EIP-7702, Account Abstraction, local-first, peer-to-peer, OrbitDB"
		/>

		<!-- Open Graph / Facebook / LinkedIn / Telegram / Mail -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://escrow01.le-space.de/" />
		<meta property="og:title" content="Vertrauliche Treuhand für delegierte Aufgaben" />
		<meta
			property="og:description"
			content="Alice delegiert eine Aufgabe an Bob und sperrt ein Budget, dessen Betrag verschlüsselt bleibt (Zama FHE, ERC-7984). Ein Passkey signiert, das Gas ist gesponsert. Demo im Sepolia-Testnetz."
		/>
		<meta property="og:image" content="https://escrow01.le-space.de/og/escrow01.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta
			property="og:image:alt"
			content="Vertrauliche Treuhand: Budget gesperrt, Betrag verschlüsselt, Freigabe per Passkey. escrow01, Sepolia-Testnetz."
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="Le Space" />
		<meta property="og:locale" content="de_DE" />
		<meta property="og:locale:alternate" content="en_US" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://escrow01.le-space.de/" />
		<meta property="twitter:title" content="Vertrauliche Treuhand für delegierte Aufgaben" />
		<meta
			property="twitter:description"
			content="Alice delegiert eine Aufgabe an Bob und sperrt ein Budget, dessen Betrag verschlüsselt bleibt (Zama FHE, ERC-7984). Ein Passkey signiert, das Gas ist gesponsert. Demo im Sepolia-Testnetz."
		/>
		<meta property="twitter:image" content="https://escrow01.le-space.de/og/escrow01.jpg" />
		<meta
			property="twitter:image:alt"
			content="Vertrauliche Treuhand: Budget gesperrt, Betrag verschlüsselt, Freigabe per Passkey. escrow01, Sepolia-Testnetz."
		/>

		<!-- Additional Meta Tags -->
		<meta name="application-name" content="escrow01" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="escrow01" />
		<meta name="msapplication-TileColor" content="#0B0E15" />
		<meta name="msapplication-config" content="./browserconfig.xml" />

		<!-- Still de-indexed, like every chapter, but canonical to itself: a link
		     preview that follows the canonical (LinkedIn does) would otherwise show
		     the main app instead of this demo. -->
		<link rel="canonical" href="https://escrow01.le-space.de/" />
		<!-- The same preview in English, for a link shared with somebody who
		     reads no German: english-link-preview.js builds /en/. -->
		<link rel="alternate" hreflang="de" href="https://escrow01.le-space.de/" />
		<link rel="alternate" hreflang="en" href="https://escrow01.le-space.de/en/" />

		<!-- Technical Meta Tags -->
		<meta name="format-detection" content="telephone=no" />
		<meta name="robots" content="noindex, follow" />
		<meta name="googlebot" content="noindex, follow" />

		<!-- Schema.org markup -->
		<meta itemprop="name" content="Vertrauliche Treuhand für delegierte Aufgaben · escrow01" />
		<meta
			itemprop="description"
			content="Demo im Sepolia-Testnetz: ein Budget für eine delegierte Aufgabe, gesperrt in einem vertraulichen Token (Zama FHE, ERC-7984), freigegeben per Passkey."
		/>
		<meta itemprop="image" content="https://escrow01.le-space.de/og/escrow01.jpg" />

		<!-- The splash: the mark, while the app's code is on its way. Nothing
		     can be drawn before it arrives (ssr = false), and on a slow phone
		     line that is several seconds of an empty page. It waits 0.6 s before
		     it fades in, so a load that finishes sooner (any local one, the demo
		     film's) never shows it, and it goes the moment the app has put
		     anything on the page — the start dialog, modal from its first frame,
		     or an error. If that never happens, it says so after 15 s and offers
		     a reload rather than turning for ever. A style, no script: the
		     removal is the layout's, with the `:has()` rule as the fallback. -->
		<style>
			#app-splash {
				--coral: #e8503f;
				--cyan: #0e86c4;
				position: fixed;
				inset: 0;
				z-index: 40;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				padding: 1rem;
				color: #41506b;
				font:
					14px/1.5 system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				text-align: center;
				opacity: 0;
				pointer-events: none;
				animation: app-splash-in 300ms ease-out 600ms forwards;
			}
			.dark #app-splash {
				--coral: #ff6b5b;
				--cyan: #58c7f3;
				color: #a8b3c7;
			}
			body:has(#app-root > :not(script)) #app-splash {
				display: none;
			}
			#app-splash .flow {
				animation: app-splash-flow 1.2s linear infinite;
			}
			#app-splash p {
				margin: 0;
			}
			#app-splash .slow {
				visibility: hidden;
				pointer-events: auto;
				animation: app-splash-show 0s 15s forwards;
			}
			#app-splash a {
				color: inherit;
				text-decoration: underline;
				text-underline-offset: 2px;
			}
			#app-splash .sr {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
			@keyframes app-splash-in {
				to {
					opacity: 1;
				}
			}
			/* Two dash periods per turn, so the loop has no seam. */
			@keyframes app-splash-flow {
				to {
					stroke-dashoffset: calc(var(--period) * -2);
				}
			}
			@keyframes app-splash-show {
				to {
					visibility: visible;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#app-splash {
					animation-duration: 1ms;
				}
				#app-splash .flow {
					animation: none;
				}
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- The Le-Space mark (packages/ui/src/LeSpaceLogo.svelte), its sync
		     links flowing. Not a dialog and nothing to focus until the slow
		     notice shows; `role="status"` names what is happening. -->
		<div id="app-splash" role="status" data-testid="app-splash">
			<svg width="72" height="72" viewBox="0 0 96 96" aria-hidden="true">
				<line
					x1="42.7"
					y1="49.96"
					x2="58.56"
					y2="34.94"
					stroke="var(--cyan)"
					stroke-width="4"
					stroke-linecap="round"
				/>
				<line
					class="flow"
					style="--period: 8.1px"
					x1="47.43"
					y1="63.58"
					x2="62.8"
					y2="64.98"
					stroke="var(--cyan)"
					stroke-width="4"
					stroke-linecap="round"
					stroke-dasharray="0.1 8"
				/>
				<line
					class="flow"
					style="--period: 6.1px"
					x1="69.85"
					y1="38.36"
					x2="72.41"
					y2="55.37"
					stroke="var(--cyan)"
					stroke-width="2.5"
					stroke-linecap="round"
					stroke-dasharray="0.1 6"
					opacity="0.65"
				/>
				<circle cx="30" cy="62" r="15" fill="var(--coral)" />
				<circle cx="68" cy="26" r="8" fill="none" stroke="var(--cyan)" stroke-width="5" />
				<circle cx="74" cy="66" r="6.5" fill="none" stroke="var(--cyan)" stroke-width="4.5" />
				<circle cx="17" cy="21" r="2.6" fill="var(--cyan)" opacity="0.55" />
			</svg>
			<span class="sr"
				><span lang="de">escrow01 wird geladen</span> ·
				<span lang="en">Loading escrow01</span></span
			>
			<p class="slow" data-testid="app-splash-slow">
				<span lang="de">Das dauert ungewöhnlich lange. <a href="">Neu laden</a></span
				><br />
				<span lang="en">This is taking unusually long. <a href="">Reload</a></span>
			</p>
			<noscript>
				<p>
					<span lang="de">escrow01 braucht JavaScript.</span><br />
					<span lang="en">escrow01 needs JavaScript.</span>
				</p>
			</noscript>
		</div>
		<div id="app-root" aria-busy="true" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
